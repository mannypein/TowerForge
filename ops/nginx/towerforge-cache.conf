# ============================================================
#  TowerForge — how long browsers keep files (nginx, http level)
#  Installed as /etc/nginx/conf.d/towerforge-cache.conf on the VPS.
#  - index.html (it also answers every tab's address): "no-cache" —
#    browsers keep it but ask each visit, and nginx answers 304 when it
#    hasn't changed, so a deploy shows on the next load. Without a
#    header browsers guessed, and some kept the old version for hours.
#  - /assets/: Vite puts a hash of the contents in every name there, so
#    a file never changes under its name: kept for a year.
#  - Everything else (icons, og-image, robots, sitemap, the API,
#    analytics): no header, as before.
#  Nothing else in the config sets add_header (2026-10-23), so the
#  server and its locations inherit this one. Install:
#      scp ops/nginx/towerforge-cache.conf ubuntu@towerforge.net:/tmp/
#      sudo cp /tmp/towerforge-cache.conf /etc/nginx/conf.d/
#      sudo nginx -t && sudo systemctl reload nginx
# ============================================================

map $uri $towerforge_cache {
    default         "";
    /index.html     "no-cache";
    ~^/assets/      "public, max-age=31536000, immutable";
}

# An empty value adds no header.
add_header Cache-Control $towerforge_cache;
