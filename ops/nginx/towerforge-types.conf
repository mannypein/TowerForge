# ============================================================
#  TowerForge — file types nginx's own list lacks (nginx, http level)
#  Installed as /etc/nginx/conf.d/towerforge-types.conf on the VPS.
#  - .apk (downloads/TowerForgeLink.apk, TowerForge Link for Android):
#    Debian's /etc/nginx/mime.types has no apk line, so it went out as
#    application/octet-stream; with Android's own type the phone's
#    browser offers to install it when the download finishes.
#  A second types block at the same level adds to mime.types (included
#  before conf.d in nginx.conf) instead of replacing it. Install:
#      scp ops/nginx/towerforge-types.conf ubuntu@towerforge.net:/tmp/
#      sudo cp /tmp/towerforge-types.conf /etc/nginx/conf.d/
#      sudo nginx -t && sudo systemctl reload nginx
#      curl -sI https://towerforge.net/downloads/TowerForgeLink.apk   (Content-Type)
# ============================================================

types {
    application/vnd.android.package-archive apk;
}
