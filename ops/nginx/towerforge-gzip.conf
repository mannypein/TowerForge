# ============================================================
#  TowerForge — compression for text files (nginx, http level)
#  Installed as /etc/nginx/conf.d/towerforge-gzip.conf on the VPS
#  (nginx.conf already has `gzip on;` but only compresses HTML).
#  Compresses the site's JavaScript, CSS, JSON and SVG — above all
#  Ask AI's two ~6 MB WebLLM scripts. Install:
#      scp ops/nginx/towerforge-gzip.conf ubuntu@towerforge.net:/tmp/
#      sudo cp /tmp/towerforge-gzip.conf /etc/nginx/conf.d/
#      sudo nginx -t && sudo systemctl reload nginx
# ============================================================

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm;
